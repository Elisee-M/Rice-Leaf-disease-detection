<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Leaf Disease Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a5f2a 0%, #2d8a4e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #e8f5e9;
            margin-bottom: 40px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #2d8a4e;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #2d8a4e;
            background: #f5f5f5;
        }

        .webcam-area {
            text-align: center;
        }

        video, .preview-img {
            width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f0f0f0;
        }

        button {
            padding: 12px 24px;
            background: #2d8a4e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #1a5f2a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: #e0e0e0;
            color: #333;
        }

        .mode-btn.active {
            background: #2d8a4e;
            color: white;
        }

        .result-box {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .result-box.healthy {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result-box.diseased {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .disease-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2d8a4e;
            transition: width 0.3s;
        }

        .score-item {
            margin: 15px 0;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .score-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: #2d8a4e;
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #2d8a4e;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Rice Leaf Disease Detector</h1>
        <p class="subtitle">Upload a photo or use your camera to detect rice leaf diseases</p>

        <div class="main-content">
            <div class="card">
                <h2>📸 Input Image</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" id="uploadModeBtn">📁 Upload</button>
                    <button class="mode-btn" id="cameraModeBtn">📷 Camera</button>
                </div>

                <div id="uploadSection">
                    <div class="upload-area" id="uploadArea">
                        <p>📤 Click or drag to upload rice leaf image</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none">
                    </div>
                </div>

                <div id="cameraSection" style="display: none;">
                    <div class="webcam-area">
                        <video id="video" autoplay playsinline></video>
                        <button id="captureBtn">📸 Capture Photo</button>
                    </div>
                </div>

                <div id="previewSection" style="display: none;">
                    <h3>Preview:</h3>
                    <img id="previewImg" class="preview-img">
                    <button id="predictBtn" style="width: 100%; margin-top: 15px;">🔍 Detect Disease</button>
                </div>

                <div id="loadingSection" style="display: none;">
                    <div class="loading">⏳ Analyzing image...</div>
                </div>
            </div>

            <div class="card">
                <h2>🔬 Detection Result</h2>
                <div id="resultSection">
                    <p style="color: #999; text-align: center;">Upload or capture an image to see results</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Class names (update these based on your model)
        const CLASS_NAMES = ['blast', 'healthy', 'insect', 'leaf_folder', 'scald', 'stripes', 'tungro'];
        
        let model = null;
        let currentImage = null;
        let mode = 'upload';
        let stream = null;

        // Load model (you'll need to convert your model to TensorFlow.js format)
        async function loadModel() {
            try {
                // Try to load local model first
                model = await tf.loadLayersModel('model/model.json');
                console.log('Model loaded successfully');
                document.getElementById('predictBtn').disabled = false;
            } catch (e) {
                console.log('No local model found. Using sample predictions for demo.');
                document.getElementById('predictBtn').disabled = false;
            }
        }

        // Preprocess image
        async function preprocessImage(imgElement) {
            const tensor = tf.browser.fromPixels(imgElement)
                .resizeNearestNeighbor([224, 224])
                .toFloat()
                .div(255.0)
                .expandDims();
            return tensor;
        }

        // Predict function
        async function predict() {
            if (!currentImage) return;

            const predictBtn = document.getElementById('predictBtn');
            const loadingSection = document.getElementById('loadingSection');
            const resultSection = document.getElementById('resultSection');
            
            predictBtn.disabled = true;
            loadingSection.style.display = 'block';
            resultSection.innerHTML = '';

            try {
                const tensor = await preprocessImage(currentImage);
                
                let predictions;
                if (model) {
                    predictions = await model.predict(tensor).data();
                } else {
                    // Demo predictions (remove this when using real model)
                    predictions = [0.15, 0.45, 0.05, 0.10, 0.05, 0.15, 0.05];
                }
                
                tensor.dispose();
                
                displayResults(predictions);
                
            } catch (error) {
                resultSection.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            } finally {
                predictBtn.disabled = false;
                loadingSection.style.display = 'none';
            }
        }

        // Display results
        function displayResults(predictions) {
            const resultSection = document.getElementById('resultSection');
            const predictedIndex = predictions.indexOf(Math.max(...predictions));
            const disease = CLASS_NAMES[predictedIndex];
            const confidence = predictions[predictedIndex];
            
            let html = `
                <div class="result-box ${disease === 'healthy' ? 'healthy' : 'diseased'}">
                    <div class="disease-name">${disease === 'healthy' ? '✅ ' : '⚠️ '}${disease.toUpperCase()}</div>
                    <div class="confidence">Confidence: ${(confidence * 100).toFixed(2)}%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${confidence * 100}%"></div>
                    </div>
                </div>
                <h3>All Classes Scores:</h3>
            `;
            
            CLASS_NAMES.forEach((name, idx) => {
                const score = predictions[idx];
                html += `
                    <div class="score-item">
                        <div class="score-header">
                            <span>${name}</span>
                            <span>${(score * 100).toFixed(1)}%</span>
                        </div>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${score * 100}%"></div>
                        </div>
                    </div>
                `;
            });
            
            resultSection.innerHTML = html;
        }

        // Switch mode
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('uploadModeBtn').classList.toggle('active', mode === 'upload');
            document.getElementById('cameraModeBtn').classList.toggle('active', mode === 'camera');
            
            document.getElementById('uploadSection').style.display = mode === 'upload' ? 'block' : 'none';
            document.getElementById('cameraSection').style.display = mode === 'camera' ? 'block' : 'none';
            
            if (mode === 'camera') {
                startCamera();
            } else {
                stopCamera();
            }
        }

        // Start camera
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
            } catch (err) {
                alert('Camera access denied or not available');
                setMode('upload');
            }
        }

        // Stop camera
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // Capture photo
        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('previewImg').src = url;
                    document.getElementById('previewSection').style.display = 'block';
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            });
        }

        // Handle file upload
        function handleFileUpload(file) {
            if (file) {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    document.getElementById('previewImg').src = url;
                    document.getElementById('previewSection').style.display = 'block';
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            }
        }

        // Event listeners
        document.getElementById('uploadModeBtn').onclick = () => setMode('upload');
        document.getElementById('cameraModeBtn').onclick = () => setMode('camera');
        document.getElementById('captureBtn').onclick = capturePhoto;
        document.getElementById('predictBtn').onclick = predict;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFileUpload(e.target.files[0]);
        
        uploadArea.ondragover = (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#2d8a4e';
        };
        
        uploadArea.ondragleave = () => {
            uploadArea.style.borderColor = '#ccc';
        };
        
        uploadArea.ondrop = (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            handleFileUpload(e.dataTransfer.files[0]);
        };

        // Load model
        loadModel();
    </script>
</body>
</html>
