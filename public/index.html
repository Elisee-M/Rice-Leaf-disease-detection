<!DOCTYPE html>
<html>
<head>
    <title>Rice Leaf Disease Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #2e7d32; }
        .upload-area {
            border: 2px dashed #4caf50;
            border-radius: 10px;
            padding: 40px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #e8f5e9;
            border-color: #2e7d32;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
        }
        .disease-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .confidence {
            font-size: 18px;
            color: #666;
        }
        .score-item {
            margin: 10px 0;
            text-align: left;
        }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        img.preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 10px;
        }
        .loading {
            color: #2e7d32;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Rice Leaf Disease Detector</h1>
        <p>Upload a rice leaf image to detect diseases</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            📸 Click to upload image
            <input type="file" id="fileInput" accept="image/*" style="display:none">
        </div>
        
        <div id="preview"></div>
        <div id="result"></div>
    </div>

    <script>
        let model = null;
        let classNames = [];
        
        // Disease classes for this model
        const DISEASES = [
            'Bacterial Blight',
            'Brown Spot', 
            'Leaf Blast',
            'Leaf Scald',
            'Leaf Smut',
            'Narrow Brown Spot',
            'Neck Blast',
            'Sheath Blight',
            'Sheath Rot',
            'Tungro'
        ];
        
        async function loadModel() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">⏳ Loading AI model...</div>';
            
            try {
                model = await tf.loadLayersModel('/model/model.json');
                resultDiv.innerHTML = '<div class="loading" style="color:green;">✅ Model ready! Upload an image.</div>';
                console.log('Model loaded successfully');
            } catch(error) {
                console.error('Error loading model:', error);
                resultDiv.innerHTML = '<div class="loading" style="color:red;">❌ Failed to load model. Check console.</div>';
            }
        }
        
        async function predictImage(file) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">🔬 Analyzing image...</div>';
            
            // Create image preview
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').innerHTML = `<img src="${e.target.result}" class="preview">`;
            };
            reader.readAsDataURL(file);
            
            // Load and predict
            const img = new Image();
            img.onload = async () => {
                // Preprocess image
                const tensor = tf.browser.fromPixels(img)
                    .resizeNearestNeighbor([224, 224])
                    .toFloat()
                    .div(255.0)
                    .expandDims(0);
                
                // Predict
                const predictions = await model.predict(tensor).data();
                const predictionArray = Array.from(predictions);
                
                // Get top prediction
                const maxScore = Math.max(...predictionArray);
                const maxIndex = predictionArray.indexOf(maxScore);
                const diseaseName = DISEASES[maxIndex] || 'Unknown';
                const confidence = (maxScore * 100).toFixed(2);
                
                // Display results
                let html = `<div class="result">
                    <div class="disease-name">🔍 ${diseaseName}</div>
                    <div class="confidence">Confidence: ${confidence}%</div>
                    <hr>
                    <h3>All Scores:</h3>`;
                
                DISEASES.forEach((name, idx) => {
                    const score = (predictionArray[idx] * 100).toFixed(1);
                    html += `<div class="score-item">
                        <span>${name}</span>
                        <span>${score}%</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${score}%"></div>
                        </div>
                    </div>`;
                });
                
                html += `</div>`;
                resultDiv.innerHTML = html;
                
                tensor.dispose();
            };
            img.src = URL.createObjectURL(file);
        }
        
        // Set up file input
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0 && model) {
                predictImage(e.target.files[0]);
            } else if (!model) {
                alert('Model is still loading. Please wait.');
            }
        });
        
        // Load model on page load
        loadModel();
    </script>
</body>
</html>
